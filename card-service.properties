spring.application.name=card-service
server.port=8083

spring.datasource.url=jdbc:postgresql://card-postgres:5434/neobank_cards
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8090/realms/neobank

spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true


# Unleash Feature Flags
io.getunleash.app-name=ms-card-service
io.getunleash.instance-id=ms-card-service-1
io.getunleash.api-url=http://unleash:4242/api
io.getunleash.environment=development
io.getunleash.custom-http-headers.Authorization=${io.getunleash.api-token}

# Observability & Distributed Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans


eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/

management.tracing.enabled=true
app.security.encryption.key=0123456789abcdef0123456789abcdef
