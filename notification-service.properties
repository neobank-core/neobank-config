spring.application.name=notification-service
server.port=8087

spring.datasource.url=jdbc:postgresql://notification-postgres:5432/neobank_notifications
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8090/realms/neobank

spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=org.neobank.*,com.neobank.*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# Observability & Distributed Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/

management.tracing.enabled=true
