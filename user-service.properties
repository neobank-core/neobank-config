spring.application.name=user-service
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8090/realms/neobank
spring.datasource.url=jdbc:postgresql://user-postgres:5432/neobank_users
spring.datasource.username=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
keycloak.server-url=http://keycloak:8090
keycloak.realm=neobank
keycloak.client-id=user-service-admin
server.port=8081
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.cache.type=redis
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.cache.redis.time-to-live=10m
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true


management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/

management.tracing.enabled=true
