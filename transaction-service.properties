spring.application.name=transaction-service
server.port=8084
spring.datasource.url=jdbc:postgresql://localhost:5435/neobank_transactions
spring.datasource.username=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.kafka.bootstrap-servers=localhost:9094
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8090/realms/neobank
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.group-id=transaction-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=org.neobank.*,com.neobank.*
spring.kafka.consumer.properties.spring.json.value.default.type=org.neobank.transactionservice.event.CardBlockedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true


io.getunleash.app-name=ms-transaction-service
io.getunleash.instance-id=ms-transaction-service-1
io.getunleash.api-url=http://localhost:4242/api
io.getunleash.environment=development
io.getunleash.custom-http-headers.Authorization=${io.getunleash.api-token}

# Observability & Distributed Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans


eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
